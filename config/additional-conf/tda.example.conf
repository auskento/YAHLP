# Tdarr Service Configuration
# Copy this to tda.conf to enable
# Code: tda (3 letters)
# Icon: config/sites-icons/tda.png (64x64 PNG)
# URL: http://tdarr:8265

<Location /tda>
    ProxyPass http://tdarr:8265/
    ProxyPassReverse http://tdarr:8265/
    ProxyPreserveHost On
</Location>

# For WebSocket support
<Location /tda/ws>
    ProxyPass ws://tdarr:8265/ws
    ProxyPassReverse ws://tdarr:8265/ws
</Location>
