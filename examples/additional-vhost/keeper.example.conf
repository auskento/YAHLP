# Keeper Automator VirtualHost Configuration
# Copy to keeper.conf to add Keeper Automator as a standalone vhost
# No dashboard menu entry (no UI, just API service)

# Dashboard Configuration
# #DASHBOARD_CODE=kee
# #APPNAME=Keeper Automator
# #DASHBOARD_VISIBLE=false    # Hidden from dashboard - no UI

# Configuration for Keeper Automator
# Replace with your actual Keeper Automator instance details
<VirtualHost *:80>
    ServerName keeper.yourdomain.com
    ServerAdmin admin@yourdomain.com

    # Proxy to Keeper Automator backend
    ProxyPreserveHost On
    ProxyPass / http://keeper-automator:3000/
    ProxyPassReverse / http://keeper-automator:3000/

    # Optional: Require authentication
    # Require valid-user
</VirtualHost>

<VirtualHost *:443>
    ServerName keeper.yourdomain.com
    ServerAdmin admin@yourdomain.com

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/yourdomain.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/yourdomain.com/privkey.pem

    ProxyPreserveHost On
    ProxyPass / http://keeper-automator:3000/
    ProxyPassReverse / http://keeper-automator:3000/

    # Optional: Require authentication
    # Require valid-user
</VirtualHost>
