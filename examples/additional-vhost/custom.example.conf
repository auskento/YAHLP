# Example Custom VirtualHost Configuration
# Copy this to yourname.conf to add a custom domain
# Files in additional-vhost/ are added as separate VirtualHosts

# Dashboard Menu Configuration (optional - omit to hide from menu)
# #DASHBOARD_CODE=cst          # 3-letter code for this service
# #APPNAME=Custom Service      # Display name on dashboard
# #DASHBOARD_WINDOW=popout     # Window behavior: popout or newtab (default: popout)
# #DASHBOARD_VISIBLE=false     # Show in dashboard menu: true or false (default: false)

# Icon: Place matching icon in /config/additional-conf/{code}.png or .svg
# Config: Optional /config/additional-conf/{code}.json5 for service status

# Example: Hidden vhost (Keeper Automator - no UI)
# #DASHBOARD_CODE=kee
# #DASHBOARD_VISIBLE=false
# <VirtualHost *:80>
#     ServerName keeper.example.com
#     ServerAdmin admin@example.com
#
#     ProxyPreserveHost On
#     ProxyPass / http://keeper-automator:port/
#     ProxyPassReverse / http://keeper-automator:port/
# </VirtualHost>

# Example: Dashboard-visible vhost (with icon and window setting)
# #DASHBOARD_CODE=app
# #APPNAME=My Custom App
# #DASHBOARD_WINDOW=popout
# #DASHBOARD_VISIBLE=true
# <VirtualHost *:443>
#     ServerName app.example.com
#     ServerAdmin admin@example.com
#
#     SSLEngine on
#     SSLCertificateFile /etc/letsencrypt/live/example.com/fullchain.pem
#     SSLCertificateKeyFile /etc/letsencrypt/live/example.com/privkey.pem
#
#     ProxyPreserveHost On
#     ProxyPass / http://your-service:port/
#     ProxyPassReverse / http://your-service:port/
# </VirtualHost>
