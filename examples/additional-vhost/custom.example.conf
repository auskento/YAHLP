# Example Custom VirtualHost Configuration
# Copy this to yourname.conf to add a custom domain
# Files in additional-vhost/ are added as separate VirtualHosts (not to menu)

# Example: Custom domain vhost
# <VirtualHost *:80>
#     ServerName custom.example.com
#     ServerAdmin admin@example.com
#
#     ProxyPreserveHost On
#     ProxyPass / http://your-service:port/
#     ProxyPassReverse / http://your-service:port/
#
#     # Optional: Require authentication
#     # Require valid-user
# </VirtualHost>

# Example: HTTPS vhost (if using Let's Encrypt)
# <VirtualHost *:443>
#     ServerName custom.example.com
#     ServerAdmin admin@example.com
#
#     SSLEngine on
#     SSLCertificateFile /etc/letsencrypt/live/custom.example.com/fullchain.pem
#     SSLCertificateKeyFile /etc/letsencrypt/live/custom.example.com/privkey.pem
#
#     ProxyPreserveHost On
#     ProxyPass / http://your-service:port/
#     ProxyPassReverse / http://your-service:port/
# </VirtualHost>
