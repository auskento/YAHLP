# Example: Tdarr App Configuration
# Copy this to tda.conf and customize for your deployment
# Code: tda (3-letter identifier)
# Icon: html/apps-icons/tda.png (64x64 PNG)
# Menu: Automatically appears when tda.conf is present

<Location /tda>
    ProxyPass http://tdarr:8265/
    ProxyPassReverse http://tdarr:8265/
    ProxyPreserveHost On

    # Authentication (if needed)
    # Require valid-user
</Location>

# For WebSocket support (if needed)
<Location /tda/ws>
    ProxyPass ws://tdarr:8265/ws
    ProxyPassReverse ws://tdarr:8265/ws
</Location>
